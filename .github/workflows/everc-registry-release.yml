# EverC fork: a static linux/amd64 `registry` binary on a GitHub release, the shape ai-utils
# fetches bazel-diff in (http_file + sha256). Each push to an everc/* branch publishes
# everc-registry-v0.<run number>.0, semver so ai-utils' Renovate can order releases; the notes
# carry the commit. gh creates the tag, so nothing pushes tags by hand.
name: everc registry release

on:
  push:
    branches: ['everc/**']
    paths:
      - 'img_tool/**'
      - '.github/workflows/everc-registry-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: img_tool/go.mod
          cache-dependency-path: img_tool/go.sum
      - name: Test
        working-directory: img_tool
        run: go test ./pkg/registry/... ./cmd/registry
      - name: Build
        working-directory: img_tool
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w -buildid=' -o ../registry-linux-amd64 ./cmd/registry
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="everc-registry-v0.${GITHUB_RUN_NUMBER}.0"
          sha256sum registry-linux-amd64 > registry-linux-amd64.sha256
          gh release create "$tag" registry-linux-amd64 registry-linux-amd64.sha256 \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes "CAS registry with --manifest-store s3. Built from $GITHUB_SHA with $(go version)."
